<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aurelia Jobs - Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  padding:24px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

h1,h2{
  margin-top:0;
}

input,textarea{
  width:100%;
  padding:13px;
  margin:6px 0 15px;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:15px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  font-size:15px;
  cursor:pointer;
  color:white;
  background:#111827;
}

button:hover{
  opacity:.9;
}

.btn-save{
  background:#16a34a;
  width:100%;
}

.btn-edit{
  background:#2563eb;
  margin-right:8px;
}

.btn-delete{
  background:#dc2626;
}

.btn-logout{
  background:#6b7280;
  float:right;
}

.job{
  border:1px solid #e5e7eb;
  padding:18px;
  border-radius:12px;
  margin-top:14px;
}

.job h3{
  margin:0 0 8px;
}

.job-info{
  color:#64748b;
  line-height:1.7;
}

.actions{
  margin-top:15px;
}

#adminPanel{
  display:none;
}

#message{
  margin-top:10px;
  padding:10px;
  border-radius:8px;
  display:none;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.loading{
  opacity:.6;
  pointer-events:none;
}

.clear{
  clear:both;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginPanel" class="card">

    <h2>Aurelia Jobs</h2>
    <p>Admin Login</p>

    <input
      type="email"
      id="email"
      placeholder="Admin email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="login()" style="width:100%;">
      Login
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- ADMIN -->
  <div id="adminPanel">

    <div class="card">

      <button class="btn-logout" onclick="logout()">
        Logout
      </button>

      <h1>Aurelia Jobs</h1>
      <p>Admin Panel</p>

      <div class="clear"></div>

    </div>


    <!-- JOB FORM -->
    <div class="card">

      <h2 id="formTitle">Add Job</h2>

      <input type="hidden" id="jobId">

      <label>Title</label>
      <input
        type="text"
        id="title"
        placeholder="Online Chat Host"
      >

      <label>Company</label>
      <input
        type="text"
        id="company"
        value="Aurelia Global"
      >

      <label>Location</label>
      <input
        type="text"
        id="location"
        value="Remote"
      >

      <label>Salary</label>
      <input
        type="text"
        id="salary"
        value="$500 - $1,000 / 14 days"
      >

      <label>Description</label>
      <textarea
        id="description"
        placeholder="Job description..."
      ></textarea>

      <label>Requirements</label>
      <textarea
        id="requirements"
        placeholder="Job requirements..."
      ></textarea>

      <label>Benefits</label>
      <textarea
        id="benefits"
        placeholder="Benefits..."
      ></textarea>

      <label>Apply Link</label>
      <input
        type="url"
        id="apply_link"
        value="https://wa.me/62881011654730"
      >

      <button
        class="btn-save"
        onclick="saveJob()"
        id="saveButton"
      >
        Save Job
      </button>

      <button
        onclick="cancelEdit()"
        id="cancelButton"
        style="display:none;width:100%;margin-top:8px;background:#6b7280;"
      >
        Cancel Edit
      </button>

      <div id="message"></div>

    </div>


    <!-- JOB LIST -->
    <div class="card">

      <h2>
        Job Listings
        <span id="jobCount" style="font-size:16px;color:#64748b;">
          0 job(s)
        </span>
      </h2>

      <div id="jobList">
        Loading...
      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://oeugfykyaookmjdvszzz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VetH8VzU8BMEkh0dZMjqWQ_uX-0AWzb";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const loginPanel =
document.getElementById("loginPanel");

const adminPanel =
document.getElementById("adminPanel");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginMessage =
document.getElementById("loginMessage");

const message =
document.getElementById("message");

const jobList =
document.getElementById("jobList");

const jobCount =
document.getElementById("jobCount");


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  checkSession
);


/* =========================
   CHECK LOGIN
========================= */

async function checkSession(){

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();

  if(error){
    console.error(error);
    showLogin();
    return;
  }

  if(data.session){
    showAdmin();
    loadJobs();
  }else{
    showLogin();
  }
}


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;

  if(!email || !password){
    showLoginError(
      "Please enter your email and password."
    );
    return;
  }

  loginMessage.style.display = "block";
  loginMessage.className = "";
  loginMessage.innerText = "Logging in...";

  const {
    data,
    error
  } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if(error){

    showLoginError(
      error.message
    );

    return;
  }

  if(data.session){

    showAdmin();

    loadJobs();

    loginMessage.style.display = "none";
  }
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  const {
    error
  } = await supabaseClient.auth.signOut();

  if(error){

    alert(
      "Logout failed: " +
      error.message
    );

    return;
  }

  showLogin();

  clearForm();
}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

  loginPanel.style.display =
    "block";

  adminPanel.style.display =
    "none";
}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

  loginPanel.style.display =
    "none";

  adminPanel.style.display =
    "block";
}


/* =========================
   LOAD JOBS
========================= */

async function loadJobs(){

  jobList.innerHTML =
    "Loading...";

  const {
    data,
    error
  } = await supabaseClient
    .from("jobs")
    .select("*")
    .order("created_at", {
      ascending:false
    });

  if(error){

    console.error(error);

    jobList.innerHTML =
      `<div class="error" style="display:block">
        Failed to load jobs.<br><br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }

  jobCount.innerText =
    data.length + " job(s)";

  if(data.length === 0){

    jobList.innerHTML =
      "<p>No jobs found.</p>";

    return;
  }

  jobList.innerHTML =
    data.map(job => {

      return `
        <div class="job">

          <h3>
            ${escapeHtml(job.title || "")}
          </h3>

          <div class="job-info">

            🏢 ${escapeHtml(job.company || "")}<br>

            📍 ${escapeHtml(job.location || "")}<br>

            💰 ${escapeHtml(job.salary || "")}

          </div>

          <div class="actions">

            <button
              class="btn-edit"
              onclick="editJob('${job.id}')"
            >
              Edit
            </button>

            <button
              class="btn-delete"
              onclick="deleteJob('${job.id}')"
            >
              Delete
            </button>

          </div>

        </div>
      `;

    }).join("");
}


/* =========================
   SAVE JOB
========================= */

async function saveJob(){

  const id =
    document.getElementById("jobId").value;

  const job = {

    title:
      document.getElementById("title").value.trim(),

    company:
      document.getElementById("company").value.trim(),

    location:
      document.getElementById("location").value.trim(),

    salary:
      document.getElementById("salary").value.trim(),

    description:
      document.getElementById("description").value.trim(),

    requirements:
      document.getElementById("requirements").value.trim(),

    benefits:
      document.getElementById("benefits").value.trim(),

    apply_link:
      document.getElementById("apply_link").value.trim(),

    work_type:
      "Remote"
  };


  if(!job.title){

    showMessage(
      "Job title is required.",
      true
    );

    return;
  }


  const button =
    document.getElementById("saveButton");

  button.disabled = true;
  button.innerText = "Saving...";


  let result;


  if(id){

    result =
      await supabaseClient
        .from("jobs")
        .update(job)
        .eq("id", id);

  }else{

    result =
      await supabaseClient
        .from("jobs")
        .insert([job]);

  }


  button.disabled = false;
  button.innerText = "Save Job";


  if(result.error){

    console.error(result.error);

    showMessage(
      "Save failed: " +
      result.error.message,
      true
    );

    return;
  }


  showMessage(
    id
      ? "Job updated successfully."
      : "Job added successfully."
  );


  clearForm();

  loadJobs();
}


/* =========================
   EDIT JOB
========================= */

async function editJob(id){

  const {
    data,
    error
  } = await supabaseClient
    .from("jobs")
    .select("*")
    .eq("id", id)
    .single();


  if(error){

    alert(
      "Unable to load job: " +
      error.message
    );

    return;
  }


  document.getElementById("jobId").value =
    data.id || "";

  document.getElementById("title").value =
    data.title || "";

  document.getElementById("company").value =
    data.company || "";

  document.getElementById("location").value =
    data.location || "";

  document.getElementById("salary").value =
    data.salary || "";

  document.getElementById("description").value =
    data.description || "";

  document.getElementById("requirements").value =
    data.requirements || "";

  document.getElementById("benefits").value =
    data.benefits || "";

  document.getElementById("apply_link").value =
    data.apply_link || "";


  document.getElementById("formTitle").innerText =
    "Edit Job";

  document.getElementById("saveButton").innerText =
    "Update Job";

  document.getElementById("cancelButton").style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================
   DELETE JOB
========================= */

async function deleteJob(id){

  const confirmed =
    confirm(
      "Are you sure you want to delete this job?"
    );

  if(!confirmed){
    return;
  }


  const {
    error
  } = await supabaseClient
    .from("jobs")
    .delete()
    .eq("id", id);


  if(error){

    console.error(error);

    showMessage(
      "Delete failed: " +
      error.message,
      true
    );

    return;
  }


  showMessage(
    "Job deleted successfully."
  );


  loadJobs();
}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

  clearForm();

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

  document.getElementById("jobId").value =
    "";

  document.getElementById("title").value =
    "";

  document.getElementById("company").value =
    "Aurelia Global";

  document.getElementById("location").value =
    "Remote";

  document.getElementById("salary").value =
    "$500 - $1,000 / 14 days";

  document.getElementById("description").value =
    "";

  document.getElementById("requirements").value =
    "";

  document.getElementById("benefits").value =
    "";

  document.getElementById("apply_link").value =
    "https://wa.me/62881011654730";


  document.getElementById("formTitle").innerText =
    "Add Job";

  document.getElementById("saveButton").innerText =
    "Save Job";

  document.getElementById("cancelButton").style.display =
    "none";
}


/* =========================
   MESSAGES
========================= */

function showMessage(
  text,
  isError = false
){

  message.innerText =
    text;

  message.className =
    isError
      ? "error"
      : "success";

  message.style.display =
    "block";

  setTimeout(() => {

    message.style.display =
      "none";

  },5000);
}


function showLoginError(text){

  loginMessage.innerText =
    text;

  loginMessage.className =
    "error";

  loginMessage.style.display =
    "block";
}


/* =========================
   SECURITY: HTML ESCAPE
========================= */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    if(session){

      showAdmin();

    }else{

      showLogin();

    }

  }
);

</script>

</body>
</html>
