<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aurelia Jobs — Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#1f2937;
}

.header{
  background:#111827;
  color:white;
  padding:18px 16px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 16px;
}

.admin-box,
.job-item{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.admin-box{
  padding:22px;
  margin-bottom:25px;
}

h1,h2{
  margin-top:0;
}

h1{font-size:25px}
h2{font-size:20px}

.subtitle{
  color:#6b7280;
  font-size:14px;
  margin-bottom:20px;
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:15px 0 7px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:15px;
  outline:none;
  background:white;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#2563eb;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 15px;
}

.full{
  grid-column:1/-1;
}

.button-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

button{
  font-family:inherit;
}

.primary-btn{
  border:0;
  background:#2563eb;
  color:white;
  padding:12px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.primary-btn:hover{
  background:#1d4ed8;
}

.secondary-btn{
  border:0;
  background:#6b7280;
  color:white;
  padding:12px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.secondary-btn:hover{
  background:#4b5563;
}

.refresh-btn{
  border:0;
  background:#059669;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.delete-btn{
  border:0;
  background:#dc2626;
  color:white;
  padding:9px 13px;
  border-radius:7px;
  cursor:pointer;
  font-weight:600;
}

.edit-btn{
  border:0;
  background:#f59e0b;
  color:white;
  padding:9px 13px;
  border-radius:7px;
  cursor:pointer;
  font-weight:600;
}

.job-list{
  display:grid;
  gap:15px;
}

.job-item{
  padding:18px;
}

.job-item h3{
  margin:0 0 8px;
  font-size:19px;
}

.company{
  color:#4b5563;
  font-weight:600;
  margin-bottom:10px;
}

.job-meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:12px;
}

.meta{
  background:#f3f4f6;
  padding:5px 8px;
  border-radius:6px;
  font-size:12px;
  color:#374151;
}

.salary{
  background:#ecfdf5;
  color:#047857;
  padding:5px 8px;
  border-radius:6px;
  font-size:12px;
  font-weight:700;
}

.job-description{
  color:#4b5563;
  font-size:14px;
  line-height:1.5;
  white-space:pre-line;
}

.job-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.status{
  padding:12px;
  border-radius:8px;
  margin-top:15px;
  display:none;
  font-size:14px;
}

.success{
  display:block;
  background:#ecfdf5;
  color:#047857;
  border:1px solid #a7f3d0;
}

.error{
  display:block;
  background:#fef2f2;
  color:#b91c1c;
  border:1px solid #fecaca;
}

.info{
  display:block;
  background:#eff6ff;
  color:#1d4ed8;
  border:1px solid #bfdbfe;
}

.hidden{
  display:none!important;
}

.empty{
  text-align:center;
  padding:30px;
  color:#6b7280;
  background:white;
  border:1px solid #e5e7eb;
  border-radius:12px;
}

.top-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.small-note{
  color:#6b7280;
  font-size:12px;
  margin-top:6px;
  line-height:1.5;
}

@media(max-width:700px){
  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .top-actions{
    flex-direction:column;
    align-items:stretch;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      Aurelia Jobs — Admin
    </div>
  </div>
</header>

<div class="container">

  <!-- ADD / EDIT FORM -->

  <div class="admin-box">

    <h1 id="formTitle">
      Add New Job
    </h1>

    <div class="subtitle">
      Create, edit and manage job opportunities.
    </div>

    <form id="jobForm">

      <input type="hidden" id="jobId">

      <div class="form-grid">

        <div>
          <label for="title">
            Job Title *
          </label>

          <input
            type="text"
            id="title"
            placeholder="Online Chat Host"
            required
          >
        </div>

        <div>
          <label for="company">
            Company *
          </label>

          <input
            type="text"
            id="company"
            placeholder="Aurelia Global"
            required
          >
        </div>

        <div>
          <label for="location">
            Location *
          </label>

          <input
            type="text"
            id="location"
            placeholder="Remote / Worldwide"
            required
          >
        </div>

        <div>
          <label for="salary">
            Salary
          </label>

          <input
            type="text"
            id="salary"
            placeholder="$500–$1,000 / 14 days"
          >
        </div>

        <div>
          <label for="work_type">
            Work Type
          </label>

          <select id="work_type">

            <option value="Remote">
              Remote
            </option>

            <option value="Work From Home">
              Work From Home
            </option>

            <option value="Part Time">
              Part Time
            </option>

            <option value="Full Time">
              Full Time
            </option>

            <option value="Freelance">
              Freelance
            </option>

          </select>
        </div>

        <div>
          <label for="apply_url">
            WhatsApp / Application URL *
          </label>

          <input
            type="url"
            id="apply_url"
            placeholder="https://wa.me/..."
            required
          >

          <div class="small-note">
            Applicants will be sent to this application link.
          </div>
        </div>

        <div class="full">

          <label for="description">
            Description *
          </label>

          <textarea
            id="description"
            placeholder="Describe the job..."
            required
          ></textarea>

        </div>

        <div class="full">

          <label for="requirements">
            Requirements
          </label>

          <textarea
            id="requirements"
            placeholder="Female, 18+, smartphone, stable internet..."
          ></textarea>

        </div>

        <div class="full">

          <label for="benefits">
            Benefits
          </label>

          <textarea
            id="benefits"
            placeholder="Training, flexible schedule, remote work..."
          ></textarea>

        </div>

      </div>

      <div class="button-row">

        <button
          type="submit"
          id="saveBtn"
          class="primary-btn">
          Publish Job
        </button>

        <button
          type="button"
          id="cancelBtn"
          class="secondary-btn hidden">
          Cancel Edit
        </button>

      </div>

      <div id="formStatus" class="status"></div>

    </form>

  </div>


  <!-- JOB LIST -->

  <div class="admin-box">

    <div class="top-actions">

      <div>
        <h2>
          Published Jobs
        </h2>

        <div
          id="jobCount"
          class="subtitle">
          Loading...
        </div>
      </div>

      <button
        type="button"
        id="refreshBtn"
        class="refresh-btn">
        ↻ Refresh Jobs
      </button>

    </div>

    <div
      id="jobsList"
      class="job-list">

      <div class="empty">
        Loading jobs...
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
  "https://oeugfykyaookmjdvszzz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_VetH8VzU8BMEkh0dZMjqWQ_uX-0AWzb";


/* =========================================
   ELEMENTS
========================================= */

const jobForm =
  document.getElementById("jobForm");

const jobId =
  document.getElementById("jobId");

const titleInput =
  document.getElementById("title");

const companyInput =
  document.getElementById("company");

const locationInput =
  document.getElementById("location");

const salaryInput =
  document.getElementById("salary");

const workTypeInput =
  document.getElementById("work_type");

const applyUrlInput =
  document.getElementById("apply_url");

const descriptionInput =
  document.getElementById("description");

const requirementsInput =
  document.getElementById("requirements");

const benefitsInput =
  document.getElementById("benefits");

const formTitle =
  document.getElementById("formTitle");

const saveBtn =
  document.getElementById("saveBtn");

const cancelBtn =
  document.getElementById("cancelBtn");

const formStatus =
  document.getElementById("formStatus");

const jobsList =
  document.getElementById("jobsList");

const jobCount =
  document.getElementById("jobCount");

const refreshBtn =
  document.getElementById("refreshBtn");


let jobs = [];


/* =========================================
   STATUS
========================================= */

function showStatus(element,message,type){

  element.textContent = message;

  element.className =
    "status " + type;

}


function clearStatus(element){

  element.textContent = "";

  element.className = "status";

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================
   SUPABASE HEADERS
========================================= */

function getHeaders(){

  return {
    "apikey": SUPABASE_KEY,
    "Authorization":
      "Bearer " + SUPABASE_KEY,
    "Content-Type":
      "application/json",
    "Prefer":
      "return=representation"
  };

}


/* =========================================
   LOAD JOBS
========================================= */

async function loadJobs(){

  jobsList.innerHTML = `
    <div class="empty">
      Loading jobs...
    </div>
  `;

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/jobs?select=*&order=created_at.desc",
        {
          method:"GET",
          headers:getHeaders()
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.message ||
        data.error_description ||
        data.hint ||
        "Unable to load jobs."
      );

    }


    jobs = Array.isArray(data)
      ? data
      : [];


    renderJobs();


  }catch(error){

    console.error(error);

    jobsList.innerHTML = `
      <div class="empty">
        <strong>Unable to load jobs.</strong>
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    jobCount.textContent =
      "Unable to load jobs.";

  }

}


/* =========================================
   RENDER JOBS
========================================= */

function renderJobs(){

  jobCount.textContent =
    jobs.length +
    (jobs.length === 1 ? " job" : " jobs");


  if(jobs.length === 0){

    jobsList.innerHTML = `
      <div class="empty">
        No jobs published yet.
      </div>
    `;

    return;

  }


  jobsList.innerHTML =
    jobs.map(function(job){

      return `

        <div class="job-item">

          <h3>
            ${escapeHTML(
              job.title ||
              "Untitled Job"
            )}
          </h3>

          <div class="company">
            🏢 ${escapeHTML(
              job.company ||
              "Company not specified"
            )}
          </div>

          <div class="job-meta">

            <span class="meta">
              📍 ${escapeHTML(
                job.location ||
                "Remote"
              )}
            </span>

            <span class="meta">
              💼 ${escapeHTML(
                job.work_type ||
                "Remote"
              )}
            </span>

            <span class="salary">
              💰 ${escapeHTML(
                job.salary ||
                "Not specified"
              )}
            </span>

          </div>

          <div class="job-description">
            ${escapeHTML(
              job.description ||
              ""
            )}
          </div>

          <div class="job-actions">

            <button
              class="edit-btn"
              onclick="editJob('${escapeHTML(job.id)}')">
              Edit
            </button>

            <button
              class="delete-btn"
              onclick="deleteJob('${escapeHTML(job.id)}')">
              Delete
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================================
   RESET FORM
========================================= */

function resetForm(){

  jobForm.reset();

  jobId.value = "";

  formTitle.textContent =
    "Add New Job";

  saveBtn.textContent =
    "Publish Job";

  cancelBtn.classList.add(
    "hidden"
  );

  clearStatus(formStatus);

}


/* =========================================
   EDIT JOB
========================================= */

window.editJob = function(id){

  const job =
    jobs.find(function(item){

      return String(item.id) ===
        String(id);

    });


  if(!job){

    showStatus(
      formStatus,
      "Job not found.",
      "error"
    );

    return;

  }


  jobId.value =
    job.id || "";

  titleIn
