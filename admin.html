<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Aurelia Jobs</title><style>body{font-family:Arial;background:#f5f7fb;padding:20px}.box{max-width:900px;margin:0 auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}input,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin-top:6px}button{padding:12px;background:#111827;color:#fff;border:0;border-radius:8px;width:100%;margin-top:10px;cursor:pointer} .item{border:1px solid #eee;padding:10px;border-radius:8px;margin-top:8px}</style></head><body>
<div id="login" style="max-width:380px;margin:80px auto;background:#fff;padding:20px;border-radius:12px;text-align:center"><h2>Admin Login</h2><p>Password: aurelia123</p><input type="password" id="pw" placeholder="password"><button onclick="if(pw.value==='aurelia123'){login.style.display='none';panel.style.display='block';load()}else{alert('Salah')}">Login</button></div>
<div id="panel" style="display:none"><div class="box"><h2>Admin - $500-$1000 / 14 Days</h2><input type="hidden" id="jid"><label>Title</label><input id="title" placeholder="Customer Support"><label>Company</label><input id="company" value="Aurelia Global"><label>Location</label><input id="location" value="Remote"><label>Salary</label><input id="salary" value="$500 - $1000 / 14 days"><label>Description</label><textarea id="desc"></textarea><label>Requirements</label><textarea id="req"></textarea><label>Benefits</label><textarea id="ben"></textarea><label>WA Link</label><input id="link" value="https://wa.me/62881011654730"><button onclick="save()">Save Job</button><div id="list"></div></div></div>
<script>
const S_URL="https://oeugfykyaookmjdvszzz.supabase.co",S_KEY="sb_publishable_VetH8VzU8BMEkh0dZMjqWQ_uX-0AWzb";
async function load(){let r=await fetch(S_URL+"/rest/v1/jobs?select=*&order=created_at.desc",{headers:{apikey:S_KEY,Authorization:"Bearer "+S_KEY}});let j=await r.json();list.innerHTML=j.map(x=>`<div class=item><b>${x.title}</b> - ${x.salary}<br><button onclick="del(${x.id})" style="background:red;width:auto">Delete</button></div>`).join('')}
async function save(){let d={title:title.value,company:company.value,location:location.value,salary:salary.value,description:desc.value,requirements:req.value,benefits:ben.value,apply_link:link.value,work_type:"Remote"};let id=jid.value;let url=id?`${S_URL}/rest/v1/jobs?id=eq.${id}`:`${S_URL}/rest/v1/jobs`;await fetch(url,{method:id?"PATCH":"POST",headers:{apikey:S_KEY,Authorization:"Bearer "+S_KEY,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(d)});alert("Saved!");load()}
async function del(id){if(confirm("hapus job ini?")){await fetch(`${S_URL}/rest/v1/jobs?id=eq.${id}`,{method:"DELETE",headers:{apikey:S_KEY,Authorization:"Bearer "+S_KEY}});load()}}
</script></body></html>
