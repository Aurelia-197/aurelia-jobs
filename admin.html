<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aurelia Jobs — Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px 16px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
    }

    .logout-btn {
      border: 0;
      background: #ef4444;
      color: white;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .login-box,
    .admin-box,
    .job-item {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .login-box {
      max-width: 430px;
      margin: 60px auto;
      padding: 25px;
    }

    .admin-box {
      padding: 22px;
      margin-bottom: 25px;
    }

    h1,
    h2 {
      margin-top: 0;
    }

    h1 {
      font-size: 25px;
    }

    h2 {
      font-size: 20px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin: 15px 0 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      font-family: inherit;
    }

    .primary-btn {
      border: 0;
      background: #2563eb;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .primary-btn:hover {
      background: #1d4ed8;
    }

    .secondary-btn {
      border: 0;
      background: #6b7280;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .secondary-btn:hover {
      background: #4b5563;
    }

    .delete-btn {
      border: 0;
      background: #dc2626;
      color: white;
      padding: 9px 13px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
    }

    .edit-btn {
      border: 0;
      background: #f59e0b;
      color: white;
      padding: 9px 13px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
    }

    .job-list {
      display: grid;
      gap: 15px;
    }

    .job-item {
      padding: 18px;
    }

    .job-item h3 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .company {
      color: #4b5563;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .meta {
      background: #f3f4f6;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
      color: #374151;
    }

    .salary {
      background: #ecfdf5;
      color: #047857;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .job-description {
      color: #4b5563;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .job-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .info {
      display: block;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .hidden {
      display: none !important;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #6b7280;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }

    .user-email {
      font-size: 13px;
      color: #d1d5db;
      margin-top: 4px;
    }

    .small-note {
      color: #6b7280;
      font-size: 12px;
      margin-top: 6px;
      line-height: 1.5;
    }

    @media (max-width: 700px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<!-- =========================================
     HEADER
========================================= -->

<header class="header">
  <div class="header-inner">

    <div>
      <div class="logo">
        Aurelia Jobs — Admin
      </div>

      <div
        id="userEmail"
        class="user-email">
      </div>
    </div>

    <button
      id="logoutBtn"
      class="logout-btn hidden">
      Logout
    </button>

  </div>
</header>


<!-- =========================================
     LOGIN
========================================= -->

<div
  id="loginSection"
  class="container">

  <div class="login-box">

    <h1>Admin Login</h1>

    <div class="subtitle">
      Sign in to manage Aurelia Jobs.
    </div>

    <form id="loginForm">

      <label for="loginEmail">
        Email
      </label>

      <input
        type="email"
        id="loginEmail"
        placeholder="Enter your email"
        required
      >

      <label for="loginPassword">
        Password
      </label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
        required
      >

      <div class="button-row">

        <button
          type="submit"
          class="primary-btn">
          Login
        </button>

      </div>

    </form>

    <div
      id="loginStatus"
      class="status">
    </div>

  </div>

</div>


<!-- =========================================
     ADMIN PANEL
========================================= -->

<div
  id="adminSection"
  class="container hidden">


  <!-- =======================================
       ADD / EDIT JOB
  ======================================== -->

  <div class="admin-box">

    <h1 id="formTitle">
      Add New Job
    </h1>

    <div class="subtitle">
      Create and publish a job opportunity.
    </div>


    <form id="jobForm">

      <input
        type="hidden"
        id="jobId"
      >


      <div class="form-grid">


        <!-- TITLE -->

        <div>

          <label for="title">
            Job Title *
          </label>

          <input
            type="text"
            id="title"
            placeholder="Online Chat Host"
            required
          >

        </div>


        <!-- COMPANY -->

        <div>

          <label for="company">
            Company *
          </label>

          <input
            type="text"
            id="company"
            placeholder="Aurelia Global"
            required
          >

        </div>


        <!-- LOCATION -->

        <div>

          <label for="location">
            Location *
          </label>

          <input
            type="text"
            id="location"
            placeholder="Remote / Worldwide"
            required
          >

        </div>


        <!-- SALARY -->

        <div>

          <label for="salary">
            Salary
          </label>

          <input
            type="text"
            id="salary"
            placeholder="$500–$1,000 / 14 days"
          >

        </div>


        <!-- WORK TYPE -->

        <div>

          <label for="work_type">
            Work Type
          </label>

          <select id="work_type">

            <option value="Remote">
              Remote
            </option>

            <option value="Work From Home">
              Work From Home
            </option>

            <option value="Part Time">
              Part Time
            </option>

            <option value="Full Time">
              Full Time
            </option>

            <option value="Freelance">
              Freelance
            </option>

          </select>

        </div>


        <!-- APPLICATION URL -->

        <div>

          <label for="apply_url">
            WhatsApp / Application URL *
          </label>

          <input
            type="url"
            id="apply_url"
            placeholder="https://wa.me/..."
            required
          >

          <div class="small-note">
            Put the WhatsApp link here. Applicants will be sent directly to this link.
          </div>

        </div>


        <!-- DESCRIPTION -->

        <div class="full">

          <label for="description">
            Description *
          </label>

          <textarea
            id="description"
            placeholder="Describe the job..."
            required
          ></textarea>

        </div>


        <!-- REQUIREMENTS -->

        <div class="full">

          <label for="requirements">
            Requirements
          </label>

          <textarea
            id="requirements"
            placeholder="Female, 18+, smartphone, stable internet..."
          ></textarea>

        </div>


        <!-- BENEFITS -->

        <div class="full">

          <label for="benefits">
            Benefits
          </label>

          <textarea
            id="benefits"
            placeholder="Training, flexible schedule, remote work..."
          ></textarea>

        </div>


      </div>


      <div class="button-row">

        <button
          type="submit"
          id="saveBtn"
          class="primary-btn">
          Publish Job
        </button>

        <button
          type="button"
          id="cancelBtn"
          class="secondary-btn hidden">
          Cancel Edit
        </button>

      </div>


      <div
        id="formStatus"
        class="status">
      </div>

    </form>

  </div>


  <!-- =======================================
       JOB LIST
  ======================================== -->

  <div class="admin-box">

    <h2>
      Published Jobs
    </h2>

    <div
      id="jobCount"
      class="subtitle">
      Loading...
    </div>

    <div
      id="jobsList"
      class="job-list">

      <div class="empty">
        Loading jobs...
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================
   SUPABASE CONFIGURATION
========================================= */

const SUPABASE_URL =
  "https://oeugfykyaookmjdvszzz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_VetH8VzU8BMEkh0dZMjqWQ_uX-0AWzb";


/* =========================================
   GLOBAL VARIABLES
========================================= */

let currentSession = null;
let jobs = [];


/* =========================================
   ELEMENTS
========================================= */

const loginSection =
  document.getElementById("loginSection");

const adminSection =
  document.getElementById("adminSection");

const logoutBtn =
  document.getElementById("logoutBtn");

const userEmail =
  document.getElementById("userEmail");

const loginForm =
  document.getElementById("loginForm");

const loginStatus =
  document.getElementById("loginStatus");

const jobForm =
  document.getElementById("jobForm");

const formTitle =
  document.getElementById("formTitle");

const formStatus =
  document.getElementById("formStatus");

const saveBtn =
  document.getElementById("saveBtn");

const cancelBtn =
  document.getElementById("cancelBtn");

const jobsList =
  document.getElementById("jobsList");

const jobCount =
  document.getElementById("jobCount");


/* =========================================
   STATUS MESSAGE
========================================= */

function showStatus(
  element,
  message,
  type
) {

  element.textContent = message;

  element.className =
    "status " + type;

}


function clearStatus(element) {

  element.textContent = "";

  element.className =
    "status";

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    clearStatus(loginStatus);

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("loginPassword")
        .value;

    showStatus(
      loginStatus,
      "Signing in...",
      "info"
    );

    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/auth/v1/token?grant_type=password",
          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error_description ||
          data.msg ||
          data.message ||
          "Login failed."
        );
      }


      currentSession = data;


      localStorage.setItem(
        "aurelia_access_token",
        data.access_token
      );

      localStorage.setItem(
        "aurelia_refresh_token",
        data.refresh_token || ""
      );

      localStorage.setItem(
        "aurelia_user_email",
        email
      );


      showAdmin();


    } catch (error) {

      console.error(error);

      showStatus(
        loginStatus,
        error.message ||
        "Login failed.",
        "error"
      );
    }

  }
);


/* =========================================
   SHOW ADMIN
========================================= */

function showAdmin() {

  loginSection.classList.add("hidden");

  adminSection.classList.remove("hidden");

  logoutBtn.classList.remove("hidden");

  const email =
    localStorage.getItem(
      "aurelia_user_email"
    );

  userEmail.textContent =
    email || "Admin";

  loadJobs();
}


/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(
  "click",
  async function() {

    const token =
      localStorage.getItem(
        "aurelia_access_token"
      );

    try {

      if (token) {

        await fetch(
          SUPABASE_URL +
          "/auth/v1/logout",
          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + token
            }
          }
        );
      }

    } catch (error) {

      console.error(error);

    }


    localStorage.removeItem(
      "aurelia_access_token"
    );

    localStorage.removeItem(
      "aurelia_refresh_token"
    );

    localStorage.removeItem(
      "aurelia_user_email"
    );

    currentSession = null;

    adminSection.classList.add(
      "hidden"
    );

    logoutBtn.classList.add(
      "hidden"
    );

    loginSection.classList.remove(
      "hidden"
    );

    loginForm.reset();

  }
);


/* =========================================
   AUTH CHECK
========================================= */

function checkExistingLogin() {

  const token =
    localStorage.getItem(
      "aurelia_access_token"
    );

  const email =
    localStorage.getItem(
      "aurelia_user_email"
    );

  if (token) {

    currentSession = {
      access_token: token
    };

    userEmail.textContent =
      email || "Admin";

    showAdmin();

  } else {

    loginSection.classList.remove(
      "hidden"
    );

    adminSection.classList.add(
      "hidden"
    );

  }
}


/* =========================================
   GET AUTH TOKEN
========================================= */

function getToken() {

  return localStorage.getItem(
    "aurelia_access_token"
  );
}


/* =========================================
   LOAD JOBS
========================================= */

async function loadJobs() {

  jobsList.innerHTML = `
    <div class="empty">
      Loading jobs...
    </div>
  `;

  try {

    const token =
      getToken();

    if (!token) {

      throw new Error(
        "You are not logged in."
      );
    }


    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/jobs?select=*&order=created_at.desc",
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + token
          }
        }
      );


    if (!response.ok) {

      const text =
        await response.text();

      console.error(text);

      throw new Error(
        "Unable to load jobs."
      );
    }


    jobs =
      await response.json();


    renderJobs();


  } catch (error) {

    console.error(error);

    jobsList.innerHTML = `
      <div class="empty">
        Unable to load jobs.
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    jobCount.textContent =
      "Unable to load jobs.";
  }
}


/* =========================================
   RENDER JOBS
========================================= */

function renderJobs() {

  jobCount.textContent =
    jobs.length +
    (jobs.length === 1
      ? " job"
      : " jobs");


  if (jobs.length === 0) {

    jobsList.innerHTML = `
      <div class="empty">
        No jobs published yet.
      </div>
    `;

    return;
  }


  jobsList.innerHTML =
    jobs.map(function(job) {

      return `

        <div class="job-item">

          <h3>
            ${escapeHTML(
              job.title ||
              "Untitled Job"
            )}
          </h3>

          <div class="company">
            🏢 ${escapeHTML(
              job.company ||
              "Company not specified"
            )}
          </div>

          <div class="job-meta">

            <span class="meta">
              📍 ${escapeHTML(
                job.location ||
                "Remote"
              )}
            </span>

            <span class="meta">
              💼 ${escapeHTML(
                job.work_type ||
                "Remote"
              )}
            </span>

            <span class="salary">
              💰 ${escapeHTML(
                job.salary ||
                "Not specified"
              )}
            </span>

          </div>

          <div class="job-description">
            ${escapeHTML(
              job.description ||
              ""
            )}
          </div>

          <div class="job-actions">

            <button
              class="edit-btn"
              onclick="editJob('${job.id}')">
              Edit
            </button>

            <button
              class="delete-btn"
              onclick="deleteJob('${job.id}')">
              Delete
            </button>

          </div>

        </div>

      `;

    }).join("");
}


/* =========================================
   ADD / UPDATE JOB
========================================= */

jobForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    clearStatus(formStatus);

    const token =
      getToken();

    if (!token) {

      showStatus(
        formStatus,
        "Your session has expired. Please login again.",
        "error"
      );

      return;
    }


    const jobId =
      document
        .getElementById("jobId")
        .value
        .trim();


    const jobData = {

      title:
        document
          .getElementById("title")
          .value
          .trim(),

      company:
        document
          .getElementById("company")
          .value
          .trim(),

      location:
        document
          .getElementById("location")
          .value
          .trim(),

      salary:
        document
          .getElementById("salary")
          .value
          .trim(),

      work_type:
        document
          .getElementById("work_type")
          .value,

      description:
        document
          .getElementById("description")
          .value
          .trim(),

      requirements:
        document
          .getElementById("requirements")
          .value
          .trim(),

      benefits:
        document
          .getElementById("benefits")
          .value
          .trim(),

      apply_url:
        document
          .getElementById("apply_url")
          .value
          .trim()

    };


    if (!jobData.title ||
        !jobData.company ||
        !jobData.location ||
        !jobData.description ||
        !jobData.apply_url) {

      showStatus(
        formStatus,
        "Please complete all required fields.",
        "error"
      );

      return;
    }


    saveBtn.disabled = true;

    saveBtn.textContent =
      jobId
        ? "Updating..."
        : "Publishing...";


    try {

      let response;


      if (jobId) {

        /* UPDATE */

        response =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/jobs?id=eq." +
            encodeURIComponent(jobId),
            {
              method: "PATCH",

              headers: {
                "apikey": SUPABASE_KEY,

                "Authorization":
                  "Bearer " + token,

                "Content-Type":
                  "application/json",

                "Prefer":
                  "return=representation"
              },

              body:
                JSON.stringify(jobData)
            }
          );

      } else {

        /* INSERT */

        response =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/jobs",
            {
              method: "POST",

              headers: {
                "apikey": SUPABASE_KEY,

                "Authorization":
                  "Bearer " + token,

                "Content-Type":
                  "application/json",

                "Prefer":
                  "return=representation"
              },

              body:
                JSON.stringify(jobData)
            }
          );
      }


      if (!response.ok) {

        const errorText =
          await response.text();

        console.error(
          "Supabase error:",
          errorText
        );

        throw new Error(
          "Database rejected the request."
        );
      }


      showStatus(
        formStatus,
        jobId
          ? "Job updated successfully."
          : "Job published successfully.",
        "success"
      );


      resetForm();

      await loadJobs();


    } catch (error) {

      console.error(error);

      showStatus(
        formStatus,
        error.message ||
        "Unable to save job.",
        "error"
      );

    } finally {

      saveBtn.disabled = false;

      saveBtn.textContent =
        document
          .getElementById("jobId")
          .value
          ? "Update Job"
          : "Publish Job";
    }

  }
);


/* =========================================
   EDIT JOB
========================================= */

window.editJob = function(id) {

  const job =
    jobs.find(function(item) {

      return String(item.id) ===
        String(id);

    });


  if (!job) {

    alert(
      "Job not found."
    );

    return;
  }


  document
    .getElementById("jobId")
    .value =
      job.id || "";


  document
    .getElementById("title")
    .value =
      job.title || "";


  document
    .getElementById("company")
    .value =
      job.company || "";


  document
    .getElementById("location")
    .value =
      job.location || "";


  document
    .getElementById("salary")
    .value =
      job.salary || "";


  document
    .getElementById("work_type")
    .value =
      job.work_type || "Remote";


  document
    .getElementById("description")
    .value =
      job.description || "";


  document
    .getElementById("requirements")
    .value =
      job.requirements || "";


  document
    .getElementById("benefits")
    .value =
      job.benefits || "";


  document
    .getElementById("apply_url")
    .value =
      job.apply_url ||
      job.apply_link ||
      "";


  formTitle.textContent =
    "Edit Job";


  saveBtn.textContent =
    "Update Job";


  cancelBtn.classList.remove(
    "hidden"
  );


  clearStatus(formStatus);


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

};


/* =========================================
   DELETE JOB
========================================= */

window.deleteJob = async function(id) {

  const confirmed =
    confirm(
      "Are you sure you want to delete this job?"
    );


  if (!confirmed) {
    return;
  }


  const token =
    getToken();


  if (!token) {

    alert(
      "Your session has expired. Please login again."
    );

    return;
  }


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/jobs?id=eq." +
        encodeURIComponent(id),
        {
          method: "DELETE",

          headers: {
            "apikey": SUPABASE_KEY,

            "Authorization":
              "Bearer " + token,

            "Prefer":
              "return=minimal"
          }
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        errorText
      );

      throw new Error(
        "Unable to delete job."
      );
    }


    alert(
      "Job deleted successfully."
    );


    await loadJobs();


  } catch (error) {

    console.error(error);

    alert(
      error.message ||
      "Unable to delete job."
    );

  }

};


/* =========================================
   CANCEL EDIT
========================================= */

cancelBtn.addEventListener(
  "click",
  function() {

    resetForm();

    clearStatus(formStatus);

  }
);


/* =========================================
   RESET FORM
========================================= */

function resetForm() {

  jobForm.reset();

  document
    .getElementById("jobId")
    .value = "";


  document
    .getElementById("work_type")
    .value = "Remote";


  formTitle.textContent =
    "Add New Job";


  saveBtn.textContent =
    "Publish Job";


  cancelBtn.classList.add(
    "hidden"
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

   START

checkExistingLogin();
