<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="k-bOFnhL7ZFaxPrNqCShCBmWqkPesoyAPaotvnsPDwk" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aurelia Jobs — Remote & Online Job Opportunities</title>

  <meta name="description"
        content="Find remote, online and work from home job opportunities with Aurelia Jobs.">

  <meta name="keywords"
        content="remote jobs, online jobs, work from home, WFH jobs, online host jobs, Aurelia Jobs">

  <meta name="robots" content="index, follow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 22px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

   .header-inner {
      max-width: 1100px;
      margin: auto;
    }

   .logo {
      font-size: 27px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 5px;
    }

   .tagline {
      color: #6b7280;
      font-size: 14px;
    }

   .search-area {
      max-width: 1100px;
      margin: 22px auto;
      padding: 0 16px;
    }

   .search-box {
      width: 100%;
      padding: 15px 17px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: white;
    }

   .search-box:focus {
      border-color: #2563eb;
    }

   .top-bar {
      max-width: 1100px;
      margin: 0 auto 15px;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

   .job-count {
      font-size: 14px;
      color: #6b7280;
    }

   .refresh-btn {
      border: 0;
      background: #111827;
      color: white;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

   .refresh-btn:hover {
      background: #000000;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 0 16px 40px;
    }

   .jobs {
      display: grid;
      gap: 16px;
    }

   .job-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.04);
    }

   .job-title {
      margin: 0 0 8px;
      font-size: 21px;
      color: #111827;
    }

   .company {
      font-weight: 600;
      color: #374151;
      margin-bottom: 10px;
    }

   .job-info {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 15px;
    }

   .info {
      background: #f3f4f6;
      color: #374151;
      padding: 6px 9px;
      border-radius: 7px;
      font-size: 13px;
    }

   .salary {
      color: #047857;
      font-weight: 700;
      background: #ecfdf5;
      padding: 6px 9px;
      border-radius: 7px;
      font-size: 13px;
    }

   .section-title {
      font-size: 14px;
      font-weight: 700;
      margin: 16px 0 7px;
      color: #111827;
    }

   .description,
   .requirements,
   .benefits {
      color: #4b5563;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-line;
    }

   .apply-btn {
      display: inline-block;
      margin-top: 18px;
      width: 100%;
      padding: 13px 16px;
      border: 0;
      border-radius: 9px;
      background: #16a34a;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

   .apply-btn:hover {
      background: #15803d;
    }

   .apply-btn.disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

   .date {
      margin-top: 12px;
      color: #9ca3af;
      font-size: 12px;
    }

   .loading,
   .empty,
   .error {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      color: #6b7280;
    }

   .error {
      color: #b91c1c;
      background: #fef2f2;
    }

    footer {
      border-top: 1px solid #e5e7eb;
      background: white;
      text-align: center;
      padding: 25px 15px;
      color: #9ca3af;
      font-size: 13px;
      margin-top: 30px;
    }

    @media (min-width: 700px) {
     .jobs {
        grid-template-columns: repeat(2, 1fr);
      }

     .apply-btn {
        width: auto;
        min-width: 180px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">Aurelia Jobs</div>
    <div class="tagline">
      Remote & Online Job Opportunities
    </div>
  </div>
</header>

<section class="search-area">
  <input
    type="search"
    id="searchInput"
    class="search-box"
    placeholder="Search jobs, company, location..."
    autocomplete="off"
  >
</section>

<div class="top-bar">
  <div id="jobCount" class="job-count">
    Loading jobs...
  </div>

  <button id="refreshBtn" class="refresh-btn">
    ↻ Refresh
  </button>
</div>

<main>
  <div id="jobsContainer" class="jobs">
    <div class="loading">
      Loading jobs...
    </div>
  </div>
</main>

<footer>
  © 2026 Aurelia Jobs. All rights reserved.
</footer>

<script>
  const SUPABASE_URL = "https://oeugfykyaookmjdvszzz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_VetH8VzU8BMEkh0dZMjqWQ_uX-0AWzb";

  let allJobs = [];
  let filteredJobs = [];

  function escapeHTML(value) {
    if (value === null || value === undefined) return "";
    return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  function formatDate(dateValue) {
    if (!dateValue) return "";
    const date = new Date(dateValue);
    if (isNaN(date.getTime())) return "";
    return date.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  function getApplyUrl(job) {
    const url = job.apply_url || job.apply_link || "";
    if (!url) return "";
    try {
      const parsed = new URL(url);
      if (parsed.protocol === "http:" || parsed.protocol === "https:") return parsed.href;
      return "";
    } catch (error) {
      return "";
    }
  }

  async function loadJobs() {
    const container = document.getElementById("jobsContainer");
    const count = document.getElementById("jobCount");
    container.innerHTML = `<div class="loading">Loading jobs...</div>`;
    count.textContent = "Loading jobs...";
    try {
      const response = await fetch(SUPABASE_URL + "/rest/v1/jobs?select=*&order=created_at.desc", {
        method: "GET",
        headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
      });
      if (!response.ok) {
        const errorText = await response.text();
        console.error("Supabase error:", errorText);
        throw new Error("Unable to load jobs.");
      }
      const data = await response.json();
      allJobs = Array.isArray(data)? data : [];
      filteredJobs = [...allJobs];
      renderJobs();
    } catch (error) {
      console.error(error);
      count.textContent = "Unable to load jobs";
      container.innerHTML = `<div class="error"><strong>Unable to load jobs.</strong><br><br>Please refresh the page and try again.</div>`;
    }
  }

  function renderJobs() {
    const container = document.getElementById("jobsContainer");
    const count = document.getElementById("jobCount");
    count.textContent = filteredJobs.length + (filteredJobs.length === 1? " job" : " jobs");
    if (filteredJobs.length === 0) {
      container.innerHTML = `<div class="empty">No jobs found.</div>`;
      return;
    }
    container.innerHTML = filteredJobs.map(function(job, index) {
      const title = job.title || "Untitled Job";
      const company = job.company || "Company not specified";
      const location = job.location || "Remote";
      const salary = job.salary || "Not specified";
      const workType = job.work_type || "Remote";
      const description = job.description || "No description available.";
      const requirements = job.requirements || "";
      const benefits = job.benefits || "";
      const applyUrl = getApplyUrl(job);
      return `
          <article class="job-card">
            <h2 class="job-title">${escapeHTML(title)}</h2>
            <div class="company">🏢 ${escapeHTML(company)}</div>
            <div class="job-info">
              <span class="info">📍 ${escapeHTML(location)}</span>
              <span class="info">💼 ${escapeHTML(workType)}</span>
              <span class="salary">💰 ${escapeHTML(salary)}</span>
            </div>
            <div class="section-title">Description</div>
            <div class="description">${escapeHTML(description)}</div>
            ${requirements? `<div class="section-title">Requirements</div><div class="requirements">${escapeHTML(requirements)}</div>` : ""}
            ${benefits? `<div class="section-title">Benefits</div><div class="benefits">${escapeHTML(benefits)}</div>` : ""}
            ${applyUrl? `<button class="apply-btn" data-job-index="${index}">Apply via WhatsApp</button>` : `<button class="apply-btn disabled" disabled>Application Link Unavailable</button>`}
            ${job.created_at? `<div class="date">Posted ${formatDate(job.created_at)}</div>` : ""}
          </article>
        `;
    }).join("");
    attachApplyButtons();
  }

  function attachApplyButtons() {
    const buttons = document.querySelectorAll(".apply-btn[data-job-index]");
    buttons.forEach(function(button) {
      button.addEventListener("click", function() {
        const index = Number(button.getAttribute("data-job-index"));
        const job = filteredJobs[index];
        if (!job) return;
        const applyUrl = getApplyUrl(job);
        if (!applyUrl) {
          alert("The application link is not available for this job.");
          return;
        }
        window.open(applyUrl, "_blank", "noopener,noreferrer");
      });
    });
  }

  function searchJobs() {
    const input = document.getElementById("searchInput");
    const search = input.value.trim().toLowerCase();
    if (!search) {
      filteredJobs = [...allJobs];
      renderJobs();
      return;
    }
    filteredJobs = allJobs.filter(function(job) {
      const searchableText = [job.title, job.company, job.location, job.salary, job.description, job.requirements, job.benefits, job.work_type].filter(Boolean).join(" ").toLowerCase();
      return searchableText.includes(search);
    });
    renderJobs();
  }

  document.getElementById("searchInput").addEventListener("input", searchJobs);
  document.getElementById("refreshBtn").addEventListener("click", loadJobs);
  loadJobs();
</script>

</body>
  </html>
