<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurelia Jobs — Remote & Online Job Opportunities</title>
  <meta name="description" content="Aurelia Jobs — Remote and online job opportunities. Apply for available positions from anywhere.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f5f7fb; color: #1f2937; }
    header { background: #111827; color: white; text-align: center; padding: 32px 18px; }
    header h1 { font-size: 32px; margin-bottom: 8px; }
    header p { color: #d1d5db; font-size: 16px; }
  .container { max-width: 950px; margin: 25px auto; padding: 0 16px; }
  .search-box { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 20px; }
    input, textarea, button { font: inherit; }
    input, textarea { width: 100%; padding: 13px 14px; border: 1px solid #d1d5db; border-radius: 9px; background: white; outline: none; }
    textarea { min-height: 100px; resize: vertical; }
    input:focus, textarea:focus { border-color: #111827; }
    button { padding: 13px 18px; border: none; border-radius: 9px; background: #111827; color: white; cursor: pointer; }
    button:hover { opacity:.9; }
  .top-bar { display: flex; justify-content: space-between; margin: 15px 0; }
    #jobCount { font-weight: bold; }
    #status { color: #6b7280; font-size: 13px; }
  .job-card { background: white; border: 1px solid #e5e7eb; border-radius: 14px; padding: 22px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .job-card h2 { font-size: 22px; margin-bottom: 10px; color: #111827; }
  .job-info { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; color: #4b5563; font-size: 14px; }
  .salary { font-weight: bold; color: #059669; }
  .section-title { font-weight: bold; margin-top: 14px; margin-bottom: 5px; }
  .job-text { line-height: 1.6; color: #4b5563; }
  .apply-button { display: inline-block; margin-top: 18px; padding: 11px 18px; border: none; border-radius: 8px; background: #111827; color: white; cursor: pointer; font-size: 14px; }
  .no-jobs { background: white; padding: 40px 20px; border-radius: 14px; text-align: center; color: #6b7280; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); padding: 20px; overflow-y: auto; z-index: 1000; }
  .modal-content { max-width: 600px; margin: 40px auto; background: white; border-radius: 15px; padding: 25px; }
  .modal-content h2 { margin-bottom: 8px; }
  .selected-job { background: #f3f4f6; padding: 12px; border-radius: 8px; margin: 15px 0; font-weight: bold; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: bold; }
  .form-buttons { display: flex; gap: 10px; margin-top: 18px; }
  .cancel-button { background: #6b7280; }
  .send-button { flex: 1; }
    footer { text-align: center; padding: 30px 15px; color: #6b7280; font-size: 13px; }
    @media (max-width: 700px) {.search-box { grid-template-columns: 1fr; } header h1 { font-size: 27px; }.top-bar { flex-direction: column; gap: 7px; }.form-buttons { flex-direction: column; } }
  </style>
</head>
<body>
<header>
  <h1>Aurelia Jobs</h1>
  <p>Remote &amp; Online Job Opportunities</p>
</header>
<main class="container">
  <div class="search-box">
    <input type="search" id="searchInput" placeholder="Search jobs...">
    <input type="search" id="companyInput" placeholder="Company...">
    <input type="search" id="locationInput" placeholder="Location...">
    <button id="refreshButton" type="button">Refresh</button>
  </div>
  <div class="top-bar">
    <span id="jobCount">Loading jobs...</span>
    <span id="status"></span>
  </div>
  <section id="jobsContainer"></section>
</main>
<div class="modal" id="applicationModal">
  <div class="modal-content">
    <h2>Apply for a Job</h2>
    <p>Complete the form below. Your application will be sent by email.</p>
    <div class="selected-job" id="selectedJob">Job</div>
    <form id="applicationForm">
      <div class="form-group"><label>Full Name *</label><input type="text" id="appName" required></div>
      <div class="form-group"><label>Email *</label><input type="email" id="appEmail" required></div>
      <div class="form-group"><label>Country *</label><input type="text" id="appCountry" required></div>
      <div class="form-group"><label>Age *</label><input type="number" id="appAge" min="18" required></div>
      <div class="form-group"><label>WhatsApp / Telegram</label><input type="text" id="appContact"></div>
      <div class="form-group"><label>Previous Experience</label><textarea id="appExperience"></textarea></div>
      <div class="form-group"><label>Available Hours Per Day *</label><input type="text" id="appHours" required></div>
      <div class="form-buttons">
        <button type="button" class="cancel-button" onclick="closeApplicationForm()">Cancel</button>
        <button type="submit" class="send-button">Send Application</button>
      </div>
    </form>
  </div>
</div>
<footer>© 2026 Aurelia Jobs</footer>
<script>
const SUPABASE_URL = "https://oeugfykyaookmjdvszzz.supabase.co";
const SUPABASE_KEY = "sb_publishable_VetH8VzU8BMEkh0dZMjqWQ_uX-0AWzb";
const APPLICATION_EMAIL = "aureliaglobal197@gmail.com";
const jobsContainer = document.getElementById("jobsContainer");
const jobCount = document.getElementById("jobCount");
const status = document.getElementById("status");
const searchInput = document.getElementById("searchInput");
const companyInput = document.getElementById("companyInput");
const locationInput = document.getElementById("locationInput");
const refreshButton = document.getElementById("refreshButton");
const applicationModal = document.getElementById("applicationModal");
const selectedJob = document.getElementById("selectedJob");
const applicationForm = document.getElementById("applicationForm");
let allJobs = [];
let currentJob = null;

function escapeHTML(value) {
  return String(value?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
function formatText(text){
  if(!text) return "";
  let t = String(text).replace(/\\n/g, "\n");
  t = escapeHTML(t);
  t = t.replace(/\n/g, "<br>");
  return t;
}

async function loadJobs() {
  status.textContent = "Loading...";
  try {
    const response = await fetch(SUPABASE_URL + "/rest/v1/jobs?select=*&order=created_at.desc", {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    if (!response.ok) throw new Error("Supabase error: " + response.status);
    allJobs = await response.json();
    renderJobs();
    status.textContent = "Updated";
  } catch (error) {
    jobCount.textContent = "Unable to load jobs";
    jobsContainer.innerHTML = `<div class="no-jobs">Unable to load job listings.</div>`;
    status.textContent = "";
  }
}
function renderJobs() {
  const search = searchInput.value.trim().toLowerCase();
  const company = companyInput.value.trim().toLowerCase();
  const location = locationInput.value.trim().toLowerCase();
  const filteredJobs = allJobs.filter(function(job) {
    const searchableText = [job.title, job.description, job.requirements, job.benefits].join(" ").toLowerCase();
    return ((!search || searchableText.includes(search)) && (!company || String(job.company?? "").toLowerCase().includes(company)) && (!location || String(job.location?? "").toLowerCase().includes(location)));
  });
  jobCount.textContent = filteredJobs.length + " job(s)";
  if (filteredJobs.length === 0) {
    jobsContainer.innerHTML = `<div class="no-jobs">No matching jobs found.</div>`;
    return;
  }
  jobsContainer.innerHTML = filteredJobs.map(function(job, index) {
    return `
        <article class="job-card">
          <h2>${escapeHTML(job.title || "Untitled Job")}</h2>
          <div class="job-info">
            <span>🏢 ${escapeHTML(job.company || "Aurelia Global")}</span>
            <span>📍 ${escapeHTML(job.location || "Remote")}</span>
            <span class="salary">💰 $500 - $1000 / 14 days</span>
            <span>💼 ${escapeHTML(job.work_type || "Remote")}</span>
          </div>
          ${job.description? `<div class="section-title">Description</div><div class="job-text">${formatText(job.description)}</div>` : ""}
          ${job.requirements? `<div class="section-title">Requirements</div><div class="job-text">${formatText(job.requirements)}</div>` : ""}
          ${job.benefits? `<div class="section-title">Benefits / Details</div><div class="job-text">${formatText(job.benefits)}</div>` : ""}
          <button class="apply-button" data-index="${index}">Apply via WhatsApp</button>
        </article>
      `;
  }).join("");
  document.querySelectorAll('.apply-button').forEach(btn=>{
    btn.addEventListener('click', function(){
      const idx = this.getAttribute('data-index');
      openApplicationForm(parseInt(idx), filteredJobs);
    });
  });
}
function openApplicationForm(index, jobs) {
  currentJob = jobs[index];
  if (currentJob.apply_link && currentJob.apply_link.trim()!== "") {
    window.open(currentJob.apply_link.trim(), '_blank');
    return;
  }
  selectedJob.textContent = "Position: " + (currentJob.title || "Job") + " — " + (currentJob.company || "Aurelia Jobs");
  applicationModal.style.display = "block";
  document.body.style.overflow = "hidden";
}
function closeApplicationForm() {
  applicationModal.style.display = "none";
  document.body.style.overflow = "";
}
applicationForm.addEventListener("submit", function(event) {
  event.preventDefault();
  if (!currentJob) return;
  const name = document.getElementById("appName").value.trim();
  const email = document.getElementById("appEmail").value.trim();
  const country = document.getElementById("appCountry").value.trim();
  const age = document.getElementById("appAge").value.trim();
  const contact = document.getElementById("appContact").value.trim();
  const experience = document.getElementById("appExperience").value.trim();
  const hours = document.getElementById("appHours").value.trim();
  if (!name ||!email ||!country ||!age ||!hours) { alert("Please complete all required fields."); return; }
  if (Number(age) < 18) { alert("Applicants must be 18 or older."); return; }
  const subject = "Job Application - " + (currentJob.title || "Online Job");
  const body = `JOB APPLICATION\n\nPosition: ${currentJob.title}\nCompany: ${currentJob.company}\n\nFull Name: ${name}\nEmail: ${email}\nCountry: ${country}\nAge: ${age}\nContact: ${contact}\nExperience: ${experience}\nHours: ${hours}\n`;
  window.location.href = "mailto:" + APPLICATION_EMAIL + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
});
searchInput.addEventListener("input", renderJobs);
companyInput.addEventListener("input", renderJobs);
locationInput.addEventListener("input", renderJobs);
refreshButton.addEventListener("click", loadJobs);
applicationModal.addEventListener("click", function(event) { if (event.target === applicationModal) closeApplicationForm(); });
loadJobs();
</script>
</body>
      </html>
