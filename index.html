<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Aurelia Jobs - Remote and online job opportunities. Find work from home and flexible online jobs.">
<meta name="keywords" content="Aurelia Jobs, remote jobs, online jobs, work from home, online chat host, remote work">

<title>Aurelia Jobs — Remote & Online Jobs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
    line-height:1.6;
}

.header{
    background:linear-gradient(135deg,#173b8f,#2456c4);
    color:white;
    padding:30px 18px 70px;
}

.container{
    width:92%;
    max-width:1050px;
    margin:auto;
}

.header h1{
    font-size:32px;
    margin-bottom:5px;
}

.header p{
    font-size:16px;
    opacity:.92;
}

.search-box{
    background:white;
    padding:18px;
    border-radius:15px;
    box-shadow:0 8px 30px rgba(0,0,0,.10);
    margin-top:-35px;
    position:relative;
    display:flex;
    gap:10px;
}

.search-box input{
    flex:1;
    border:1px solid #d9deea;
    border-radius:10px;
    padding:14px;
    font-size:16px;
    outline:none;
}

.search-box input:focus{
    border-color:#173b8f;
}

.search-box button{
    border:none;
    border-radius:10px;
    padding:0 20px;
    background:#173b8f;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.info-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:25px 0 15px;
    gap:10px;
}

.job-count{
    color:#667085;
    font-size:14px;
}

.refresh-btn{
    border:none;
    background:white;
    border:1px solid #d9deea;
    border-radius:8px;
    padding:9px 14px;
    cursor:pointer;
}

.jobs{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.job-card{
    background:white;
    border:1px solid #e5e8ef;
    border-radius:15px;
    padding:22px;
    box-shadow:0 3px 15px rgba(0,0,0,.04);
}

.job-card:hover{
    box-shadow:0 7px 25px rgba(0,0,0,.08);
}

.job-title{
    font-size:22px;
    font-weight:bold;
    color:#172033;
    margin-bottom:7px;
}

.company{
    color:#4b5565;
    margin-bottom:5px;
}

.location{
    color:#667085;
    margin-bottom:8px;
}

.salary{
    font-size:17px;
    font-weight:bold;
    color:#173b8f;
    margin-top:10px;
}

.work-type{
    display:inline-block;
    margin-top:10px;
    padding:5px 10px;
    border-radius:20px;
    background:#eef4ff;
    color:#173b8f;
    font-size:13px;
    font-weight:bold;
}

.job-section{
    margin-top:18px;
}

.job-section strong{
    display:block;
    margin-bottom:5px;
}

.job-section p{
    color:#4b5565;
    white-space:pre-line;
}

.apply-btn{
    display:inline-block;
    margin-top:18px;
    background:#173b8f;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:9px;
    font-weight:bold;
}

.apply-btn:hover{
    background:#102d70;
}

.no-jobs{
    background:white;
    border-radius:15px;
    padding:40px 20px;
    text-align:center;
    color:#667085;
}

.loading{
    background:white;
    border-radius:15px;
    padding:35px;
    text-align:center;
    color:#667085;
}

.error{
    background:#fff3f3;
    color:#b42318;
    border:1px solid #f3c7c7;
    border-radius:12px;
    padding:18px;
}

.footer{
    text-align:center;
    color:#667085;
    padding:35px 15px;
    font-size:14px;
}

@media(max-width:600px){

    .header{
        padding:25px 15px 60px;
    }

    .header h1{
        font-size:27px;
    }

    .search-box{
        flex-direction:column;
        margin-top:-30px;
    }

    .search-box button{
        height:45px;
    }

    .info-bar{
        align-items:flex-start;
    }

    .job-card{
        padding:18px;
    }

    .job-title{
        font-size:20px;
    }

    .apply-btn{
        width:100%;
        text-align:center;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="container">
        <h1>Aurelia Jobs</h1>
        <p>Remote & Online Job Opportunities</p>
    </div>
</header>

<main class="container">

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search jobs, company, location..."
            autocomplete="off"
        >

        <button onclick="loadJobs()">
            Refresh
        </button>
    </div>

    <div class="info-bar">
        <div class="job-count" id="jobCount">
            Loading jobs...
        </div>

        <button class="refresh-btn" onclick="loadJobs()">
            ↻ Refresh
        </button>
    </div>

    <div id="jobs" class="jobs">
        <div class="loading">
            Loading available jobs...
        </div>
    </div>

</main>

<footer class="footer">
    © 2026 Aurelia Jobs — Remote & Online Opportunities
</footer>


<script>

/* =========================================
   SUPABASE CONFIGURATION
   ========================================= */

const SUPABASE_URL =
"https://oeugfykyaookmjdvszzz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VetH8VzU8BMEkh0dZMjqWQ_uX-0AWzb";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   VARIABLES
   ========================================= */

let allJobs = [];


/* =========================================
   SECURITY / HTML ESCAPE
   ========================================= */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value).replace(/[&<>"']/g,function(char){

        const entities = {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        };

        return entities[char];
    });
}


/* =========================================
   GET FIELD
   Supports existing Jobs table
   ========================================= */

function getField(job, possibleNames){

    for(const name of possibleNames){

        if(
            job[name] !== undefined &&
            job[name] !== null &&
            job[name] !== ""
        ){
            return job[name];
        }
    }

    return "";
}


/* =========================================
   LOAD JOBS FROM SUPABASE
   ========================================= */

async function loadJobs(){

    const jobsContainer =
        document.getElementById("jobs");

    const countContainer =
        document.getElementById("jobCount");

    jobsContainer.innerHTML = `
        <div class="loading">
            Loading available jobs...
        </div>
    `;

    countContainer.textContent =
        "Loading jobs...";


    const { data, error } = await db
        .from("Jobs")
        .select("*")
        .order("created_at", {
            ascending:false
        });


    if(error){

        console.error(error);

        countContainer.textContent =
            "Unable to load jobs";

        jobsContainer.innerHTML = `
            <div class="error">
                <strong>Unable to load jobs.</strong>
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

        return;
    }


    allJobs = data || [];

    displayJobs();

}


/* =========================================
   DISPLAY JOBS
   ========================================= */

function displayJobs(){

    const search =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    const filteredJobs =
        allJobs.filter(function(job){

            if(!search){
                return true;
            }

            const title =
                getField(job,[
                    "Title",
                    "title",
                    "Job Title"
                ]);

            const company =
                getField(job,[
                    "Company",
                    "company"
                ]);

            const location =
                getField(job,[
                    "Location",
                    "location"
                ]);

            const description =
                getField(job,[
                    "Description",
                    "description"
                ]);

            const requirements =
                getField(job,[
                    "Requirements",
                    "requirements"
                ]);


            const combined = (
                title + " " +
                company + " " +
                location + " " +
                description + " " +
                requirements
            ).toLowerCase();


            return combined.includes(search);

        });


    document.getElementById("jobCount")
        .textContent =
        filteredJobs.length + " job(s)";


    const container =
        document.getElementById("jobs");


    if(filteredJobs.length === 0){

        container.innerHTML = `
            <div class="no-jobs">
                <h3>No jobs found</h3>
                <p>
                    Try another search keyword.
                </p>
            </div>
        `;

        return;
    }


    container.innerHTML =
        filteredJobs.map(function(job){

            const title =
                getField(job,[
                    "Title",
                    "title",
                    "Job Title"
                ]) ||
                "Untitled Job";


            const company =
                getField(job,[
                    "Company",
                    "company"
                ]);


            const location =
                getField(job,[
                    "Location",
                    "location"
                ]);


            const salary =
                getField(job,[
                    "Salary",
                    "salary"
                ]);


            const workType =
                getField(job,[
                    "Work Type",
                    "Work_Type",
                    "work_type",
                    "WorkType"
                ]);


            const description =
                getField(job,[
                    "Description",
                    "description"
                ]);


            const requirements =
                getField(job,[
                    "Requirements",
                    "requirements"
                ]);


            const benefits =
                getField(job,[
                    "Benefits",
                    "benefits",
                    "Benefits / Details"
                ]);


            const applyLink =
                getField(job,[
                    "Apply_Link",
                    "Apply Link",
                    "apply_link"
                ]);


            let html = `
                <article class="job-card">

                    <div class="job-title">
                        ${escapeHTML(title)}
                    </div>
            `;


            if(company){

                html += `
                    <div class="company">
                        🏢 ${escapeHTML(company)}
                    </div>
                `;
            }


            if(location){

                html += `
                    <div class="location">
                        📍 ${escapeHTML(location)}
                    </div>
                `;
            }


            if(salary){

                html += `
                    <div class="salary">
                        💰 ${escapeHTML(salary)}
                    </div>
                `;
            }


            if(workType){

                html += `
                    <span class="work-type">
                        💼 ${escapeHTML(workType)}
                    </span>
                `;
            }


            if(description){

                html += `
                    <div class="job-section">

                        <strong>
                            Description
                        </strong>

                        <p>
                            ${escapeHTML(description)}
                        </p>

                    </div>
                `;
            }


            if(requirements){

                html += `
                    <div class="job-section">

                        <strong>
                            Requirements
                        </strong>

                        <p>
                            ${escapeHTML(requirements)}
                        </p>

                    </div>
                `;
            }


            if(benefits){

                html += `
                    <div class="job-section">

                        <strong>
                            Benefits / Details
                        </strong>

                        <p>
                            ${escapeHTML(benefits)}
                        </p>

                    </div>
                `;
            }


            if(applyLink){

                html += `
                    <a
                        class="apply-btn"
                        href="${escapeHTML(applyLink)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Apply Now
                    </a>
                `;
            }


            html += `
                </article>
            `;


            return html;

        }).join("");

}


/* =========================================
   LIVE SEARCH
   ========================================= */

document
.getElementById("searchInput")
.addEventListener(
    "input",
    displayJobs
);


/* =========================================
   START
   ========================================= */

loadJobs();

</script>

</body>
</html>
